<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hacked Brain</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
}

body{
    font-family:Tahoma,Arial,sans-serif;
    background:
        radial-gradient(circle at 15% 10%,#e8f4ff 0,transparent 35%),
        radial-gradient(circle at 90% 15%,#f0e8ff 0,transparent 35%),
        linear-gradient(135deg,#f8fcff,#fbf8ff);
    color:#405064;
    overflow:hidden;
}

button,
textarea{
    font-family:inherit;
    -webkit-tap-highlight-color:transparent;
}

button:focus,
textarea:focus{
    outline:none;
}

.app{
    height:100%;
    display:flex;
    flex-direction:column;
}

/* Header */

header{
    height:72px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    gap:12px;
    padding:0 18px;
    background:rgba(255,255,255,.72);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    border-bottom:1px solid rgba(180,200,225,.25);
}

.logo{
    width:46px;
    height:46px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:17px;
    background:linear-gradient(145deg,#e8f5ff,#f1eaff);
    box-shadow:
        0 7px 20px rgba(130,160,200,.16),
        inset 0 1px 0 rgba(255,255,255,.9);
    font-size:25px;
}

.title{
    font-size:17px;
    font-weight:bold;
    color:#40536b;
}

.subtitle{
    margin-top:4px;
    font-size:11px;
    color:#91a0b3;
}

/* Chat */

#chat{
    flex:1;
    overflow-y:auto;
    padding:22px 15px 125px;
    scroll-behavior:smooth;
}

#chatInner{
    width:100%;
    max-width:820px;
    margin:auto;
}

#welcome{
    text-align:center;
    margin-top:19vh;
    animation:welcomeIn .7s ease;
}

@keyframes welcomeIn{
    from{
        opacity:0;
        transform:translateY(12px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.welcome-brain{
    width:82px;
    height:82px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:30px;
    background:linear-gradient(145deg,#e5f4ff,#f0e8ff);
    box-shadow:
        0 15px 35px rgba(135,160,205,.18),
        inset 0 2px 5px rgba(255,255,255,.9);
    font-size:44px;
}

#welcome h2{
    margin:20px 0 8px;
    color:#50647d;
    font-size:21px;
}

#welcome p{
    margin:0;
    color:#9aa8b9;
    font-size:13px;
}

/* Messages */

.message-row{
    display:flex;
    margin:12px 0;
    animation:messageIn .25s ease;
}

@keyframes messageIn{
    from{
        opacity:0;
        transform:translateY(5px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.message-row.user{
    justify-content:flex-start;
}

.message-row.ai{
    justify-content:flex-end;
}

.message{
    max-width:78%;
    padding:12px 16px;
    border-radius:21px;
    line-height:1.8;
    font-size:14px;
    word-break:break-word;
    white-space:pre-wrap;
}

.message.user{
    color:#53677e;
    background:linear-gradient(145deg,#e8f5ff,#eef8ff);
    border:1px solid rgba(170,205,235,.28);
    border-bottom-left-radius:8px;
    box-shadow:0 7px 20px rgba(120,160,200,.11);
}

.message.ai{
    color:#59697b;
    background:rgba(255,255,255,.86);
    border:1px solid rgba(210,220,235,.5);
    border-bottom-right-radius:8px;
    box-shadow:0 7px 22px rgba(120,140,170,.10);
}

/* Typing */

.typing{
    display:flex;
    align-items:center;
    gap:5px;
    padding:13px 17px;
    background:rgba(255,255,255,.9);
    border:1px solid rgba(210,220,235,.5);
    border-radius:20px;
    box-shadow:0 7px 22px rgba(120,140,170,.10);
}

.typing span{
    width:7px;
    height:7px;
    border-radius:50%;
    background:#9bb8d5;
    animation:typing 1.1s infinite ease-in-out;
}

.typing span:nth-child(2){
    animation-delay:.15s;
}

.typing span:nth-child(3){
    animation-delay:.3s;
}

@keyframes typing{
    0%,100%{
        opacity:.3;
        transform:translateY(0);
    }
    50%{
        opacity:1;
        transform:translateY(-3px);
    }
}

/* Bottom */

.bottom{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    padding:12px 12px 16px;
    background:linear-gradient(
        to top,
        rgba(248,251,255,.98),
        rgba(248,251,255,.78),
        transparent
    );
}

.input-area{
    max-width:820px;
    margin:auto;
    display:flex;
    align-items:flex-end;
    gap:8px;
    padding:7px;
    border-radius:29px;
    background:rgba(255,255,255,.88);
    border:1px solid rgba(205,220,235,.55);
    box-shadow:
        0 10px 35px rgba(110,140,175,.14),
        inset 0 1px 0 rgba(255,255,255,.95);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
}

textarea{
    flex:1;
    min-height:44px;
    max-height:125px;
    resize:none;
    border:0;
    background:transparent;
    padding:12px 10px;
    color:#506276;
    font-size:14px;
    line-height:1.6;
}

textarea::placeholder{
    color:#aeb9c7;
}

/* Buttons */

.icon-btn{
    width:44px;
    height:44px;
    flex-shrink:0;
    border:0;
    border-radius:17px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(145deg,#f5faff,#edf4fb);
    color:#7f9ab5;
    font-size:20px;
    box-shadow:
        0 5px 13px rgba(110,145,180,.13),
        inset 0 1px 0 rgba(255,255,255,.95);
    transition:
        transform .16s ease,
        box-shadow .16s ease,
        background .16s ease;
}

.icon-btn:active{
    transform:scale(.91);
    box-shadow:
        0 2px 7px rgba(110,145,180,.12),
        inset 0 2px 5px rgba(150,175,200,.12);
}

#send{
    background:linear-gradient(145deg,#a9d9f5,#c6b9ee);
    color:white;
    box-shadow:
        0 7px 17px rgba(145,175,220,.25),
        inset 0 1px 0 rgba(255,255,255,.45);
}

#send.disabled{
    opacity:.45;
}

/* Plus menu */

.plus-wrap{
    position:relative;
}

.plus-menu{
    display:none;
    position:absolute;
    right:0;
    bottom:53px;
    min-width:155px;
    padding:7px;
    border-radius:19px;
    background:rgba(255,255,255,.95);
    border:1px solid rgba(210,220,235,.6);
    box-shadow:0 12px 35px rgba(100,130,170,.18);
    backdrop-filter:blur(15px);
}

.plus-menu.open{
    display:block;
    animation:menuIn .18s ease;
}

@keyframes menuIn{
    from{
        opacity:0;
        transform:translateY(7px) scale(.97);
    }
    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

.plus-menu button{
    width:100%;
    padding:11px 12px;
    border:0;
    border-radius:13px;
    background:transparent;
    color:#65778d;
    text-align:right;
    font-size:13px;
}

.plus-menu button:active{
    background:#edf7ff;
    transform:scale(.98);
}

input[type="file"]{
    display:none;
}

#mic.recording{
    background:linear-gradient(145deg,#e8ddff,#dcefff);
    color:#806db1;
}

/* Scrollbar */

#chat::-webkit-scrollbar{
    width:5px;
}

#chat::-webkit-scrollbar-thumb{
    background:rgba(150,175,200,.25);
    border-radius:10px;
}
</style>
</head>

<body>

<div class="app">

<header>
    <div class="logo">🧠</div>

    <div>
        <div class="title">Hacked Brain</div>
        <div class="subtitle">همراه هوشمند شما</div>
    </div>
</header>

<div id="chat">
    <div id="chatInner">

        <div id="welcome">
            <div class="welcome-brain">🧠</div>

            <h2>اینجا جای آرامش است</h2>

            <p>
                هر چیزی که در ذهنت هست، می‌تونی اینجا بنویسی.
            </p>
        </div>

    </div>
</div>

<div class="bottom">

    <div class="input-area">

        <div class="plus-wrap">

            <button
                class="icon-btn"
                id="plus"
                type="button"
            >＋</button>

            <div
                class="plus-menu"
                id="plusMenu"
            >
                <button
                    id="imageButton"
                    type="button"
                >🖼️ تصویر</button>

                <button
                    id="fileButton"
                    type="button"
                >📎 فایل</button>

                <button
                    id="moreButton"
                    type="button"
                >✨ بیشتر</button>
            </div>

        </div>

        <input
            type="file"
            id="imageInput"
            accept="image/*"
        >

        <input
            type="file"
            id="fileInput"
        >

        <button
            class="icon-btn"
            id="mic"
            type="button"
        >🎤</button>

        <textarea
            id="input"
            rows="1"
            placeholder="پیامت را بنویس..."
        ></textarea>

        <button
            class="icon-btn disabled"
            id="send"
            type="button"
        >➤</button>

    </div>

</div>

</div>

<script>

const input = document.getElementById("input");
const send = document.getElementById("send");
const mic = document.getElementById("mic");

const plus = document.getElementById("plus");
const plusMenu = document.getElementById("plusMenu");

const chat = document.getElementById("chat");
const chatInner = document.getElementById("chatInner");
const welcome = document.getElementById("welcome");


function updateSend(){

    send.classList.toggle(
        "disabled",
        input.value.trim() === ""
    );
}


input.addEventListener("input", () => {

    input.style.height = "auto";

    input.style.height =
        Math.min(input.scrollHeight,125) + "px";

    updateSend();
});


function addMessage(text,type){

    const row =
        document.createElement("div");

    row.className =
        "message-row " + type;

    const message =
        document.createElement("div");

    message.className =
        "message " + type;

    message.textContent = text;

    row.appendChild(message);

    chatInner.appendChild(row);

    chat.scrollTop =
        chat.scrollHeight;
}


function showTyping(){

    const row =
        document.createElement("div");

    row.className =
        "message-row ai";

    row.id = "typing";

    const box =
        document.createElement("div");

    box.className = "typing";

    box.innerHTML =
        "<span></span><span></span><span></span>";

    row.appendChild(box);

    chatInner.appendChild(row);

    chat.scrollTop =
        chat.scrollHeight;
}


function hideTyping(){

    const typing =
        document.getElementById("typing");

    if(typing){
        typing.remove();
    }
}


/* ارتباط مستقیم با Node.js */

async function sendMessage(){

    const text =
        input.value.trim();

    if(!text) return;

    welcome.style.display = "none";

    addMessage(text,"user");

    input.value = "";

    input.style.height = "auto";

    updateSend();

    showTyping();

    try{

        const response =
            await fetch(
                "http://127.0.0.1:3000/chat",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({
                        message:text
                    })
                }
            );


        if(!response.ok){
            throw new Error(
                "HTTP " + response.status
            );
        }


        const data =
            await response.json();


        hideTyping();

        addMessage(
            data.reply ||
            "پاسخی از سرور دریافت نشد.",
            "ai"
        );


    }catch(error){

        console.error(error);

        hideTyping();

        addMessage(
            "ارتباط با سرور برقرار نشد ❌",
            "ai"
        );
    }
}


input.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "Enter" &&
            !event.shiftKey
        ){

            event.preventDefault();

            sendMessage();
        }
    }
);


send.addEventListener(
    "click",
    sendMessage
);


plus.addEventListener(
    "click",
    () => {

        plusMenu.classList.toggle("open");
    }
);


document
.getElementById("imageButton")
.addEventListener(
    "click",
    () => {

        document
        .getElementById("imageInput")
        .click();

        plusMenu.classList.remove("open");
    }
);


document
.getElementById("fileButton")
.addEventListener(
    "click",
    () => {

        document
        .getElementById("fileInput")
        .click();

        plusMenu.classList.remove("open");
    }
);


document
.getElementById("moreButton")
.addEventListener(
    "click",
    () => {

        plusMenu.classList.remove("open");

        addMessage(
            "قابلیت‌های بیشتر به‌زودی اضافه می‌شوند ✨",
            "ai"
        );
    }
);


mic.addEventListener(
    "click",
    () => {

        mic.classList.toggle(
            "recording"
        );
    }
);


updateSend();

</script>

</body>
</html>
